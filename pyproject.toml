[project]
name = "movesim"
version = "0.1.0"
description = "A passive human skeleton in MuJoCo for exploring Feldenkrais-style movements"
authors = [
    { name = "Fontas", email = "15803552+FontasZ@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fast-simplification>=0.2.0",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.7.0",
    "mujoco>=3.17.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
